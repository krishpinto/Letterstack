# Vercel Hobby only auto-deploys commits pushed by the project owner's
# account, so Ethan's pushes to main never build. This workflow pings a
# Vercel Deploy Hook for those pushes, so merges deploy no matter who
# authored them. The hook URL lives in the VERCEL_DEPLOY_HOOK repo secret.
#
# It runs after Checks finishes, and only when Checks passed, so a commit
# that fails typecheck, lint or tests is not deployed by this hook.

name: Deploy main to Vercel

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

jobs:
  trigger-vercel:
    # krish's own pushes already deploy through Vercel's git integration —
    # only ping the hook for everyone else, so builds don't run twice.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login != 'krishpinto'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel deploy hook
        run: curl -sf -X POST "$DEPLOY_HOOK" > /dev/null
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
